<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in — UniTrade</title>
    <link rel="icon" href="/images/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/styles.css">
    <script type="module" src="/js/pages/login.js"></script>
</head>
<body>
<header id="site-header" class="site-header"></header>

<main id="main" class="container">
    <div class="card card-narrow">
        <div class="card-body">
            <h1>Welcome back</h1>
            <p class="muted">Log in to manage listings, save items and message sellers.</p>
            <div id="form-alert" class="hidden mb-2"></div>
            <form id="login-form" class="form" novalidate>
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" required maxlength="191">
                    <span class="error" data-for="email"></span>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="72">
                    <span class="error" data-for="password"></span>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-submit">Log in</button>
            </form>
            <p class="small muted mt-2 mb-0">New to UniTrade? <a id="register-link" href="/register.html">Create a student account</a></p>
        </div>
    </div>
</main>

<footer id="site-footer" class="site-footer"></footer>
</body>
</html>
