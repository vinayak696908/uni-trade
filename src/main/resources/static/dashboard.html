<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard — UniTrade</title>
    <link rel="icon" href="/images/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/styles.css">
    <script type="module" src="/js/pages/dashboard.js"></script>
</head>
<body>
<header id="site-header" class="site-header"></header>

<main id="main" class="container">
    <div class="page-head section-head">
        <div>
            <h1 id="greeting">Your dashboard</h1>
            <p>Manage your listings, profile and conversations.</p>
        </div>
        <a class="btn btn-primary" href="/sell.html">+ Sell an item</a>
    </div>
    <div id="page-alert" class="hidden mb-2"></div>

    <div class="stats mb-2" id="stats"></div>

    <div class="dash-layout">
        <aside class="card">
            <div class="card-body">
                <h2 class="h3">Profile</h2>
                <div id="profile-alert" class="hidden mb-2"></div>
                <form id="profile-form" class="form" novalidate>
                    <div class="field">
                        <label for="p-email">Email</label>
                        <input id="p-email" type="email" disabled>
                        <span class="hint">Email cannot be changed.</span>
                    </div>
                    <div class="field">
                        <label for="p-fullName">Full name</label>
                        <input id="p-fullName" name="fullName" type="text" required minlength="2" maxlength="100" autocomplete="name">
                        <span class="hint" id="p-display"></span>
                        <span class="error" data-for="fullName"></span>
                    </div>
                    <div class="field">
                        <label for="p-campus">Campus</label>
                        <select id="p-campus" name="campus" required></select>
                        <span class="error" data-for="campus"></span>
                    </div>
                    <div class="field">
                        <label for="p-phone">Phone (private)</label>
                        <input id="p-phone" name="phone" type="tel" maxlength="15" autocomplete="tel">
                        <span class="error" data-for="phone"></span>
                    </div>
                    <button type="submit" class="btn btn-primary" id="profile-submit">Save profile</button>
                </form>
                <hr class="mt-3">
                <div class="btn-group mt-2">
                    <a class="btn btn-secondary btn-sm" href="/inquiries.html">Open inbox</a>
                    <a class="btn btn-secondary btn-sm" href="/wishlist.html">My wishlist</a>
                    <a class="btn btn-secondary btn-sm hidden" href="/admin.html" id="admin-link">Admin dashboard</a>
                </div>
            </div>
        </aside>

        <section class="card" aria-labelledby="listings-heading">
            <div class="card-body section-head mb-0">
                <h2 id="listings-heading" class="mb-0">My listings</h2>
                <label class="sr-only" for="listing-filter">Show</label>
                <select id="listing-filter" class="w-auto">
                    <option value="">All listings</option>
                    <option value="AVAILABLE">Available</option>
                    <option value="SOLD">Sold</option>
                    <option value="HIDDEN">Hidden by moderator</option>
                </select>
            </div>
            <div id="listings"></div>
        </section>
    </div>
</main>

<footer id="site-footer" class="site-footer"></footer>
</body>
</html>
