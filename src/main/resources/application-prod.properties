# ---------------------------------------------------------------------------
# Production profile. Activated with SPRING_PROFILES_ACTIVE=prod (set in the
# Dockerfile). Everything here can still be overridden by environment variables.
# ---------------------------------------------------------------------------

# The app runs behind the host's HTTPS proxy: trust X-Forwarded-* headers so Spring
# knows requests arrived over HTTPS (needed for secure cookies and correct URLs).
server.forward-headers-strategy=framework

# Session cookie is sent only over HTTPS in production.
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}

# Uploaded photos must live on a persistent volume, or they vanish on every redeploy.
app.upload.dir=${UPLOAD_DIR:/data/uploads}

# Static files can be cached briefly by browsers in production.
spring.web.resources.cache.cachecontrol.no-cache=false
spring.web.resources.cache.cachecontrol.max-age=10m

logging.level.root=INFO
