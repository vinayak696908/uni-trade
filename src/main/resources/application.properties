# ---------------------------------------------------------------------------
# UniTrade configuration
# All secrets come from environment variables or a local, git-ignored .env file
# in the project root (KEY=VALUE lines). Real environment variables override .env.
# ---------------------------------------------------------------------------
spring.application.name=unitrade
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# --- MySQL -----------------------------------------------------------------
# Priority: DB_URL / DB_USERNAME / DB_PASSWORD if set; otherwise Railway's MySQL variables
# (MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD); otherwise local defaults.
spring.datasource.url=${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:unitrade}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:unitrade}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Schema is owned by Flyway (src/main/resources/db/migration). Hibernate never alters tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Sessions & cookies ------------------------------------------------------
server.servlet.session.cookie.name=UNITRADE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Must be true in production (HTTPS). false only for http://localhost development.
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=8h
server.servlet.session.tracking-modes=cookie

# --- Error output: never leak stack traces or internals ---------------------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# --- Uploads ---------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB
# Let Tomcat read oversized uploads fully so the client receives a JSON 413 instead of a reset connection.
server.tomcat.max-swallow-size=30MB
app.upload.dir=${UPLOAD_DIR:uploads}

# --- Development-only demo data (see DevDataSeeder) -------------------------
app.seed.enabled=${SEED_DEMO_DATA:false}
app.seed.admin-email=${SEED_ADMIN_EMAIL:}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.demo-password=${SEED_DEMO_PASSWORD:}

# --- Static files: let browsers revalidate so frontend edits show up ----------
spring.web.resources.cache.cachecontrol.no-cache=true

logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}

# --- Health check (used by Railway / Docker) ---------------------------------
# Only /actuator/health is exposed, and it reveals no details to the public.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# Finish in-flight requests when the platform stops or redeploys the container.
server.shutdown=graceful
