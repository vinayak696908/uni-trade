# Integration tests run against a REAL MySQL database (default: unitrade_test on localhost),
# created automatically if the MySQL user has permission. Each test runs in a transaction
# that is rolled back, so the test database stays clean.
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/unitrade_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${TEST_DB_USERNAME:${DB_USERNAME:unitrade}}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD:}}
app.seed.enabled=false
app.upload.dir=target/test-uploads
