# Builds UniTrade and runs the full integration test suite against a real MySQL
# database on every push and pull request. Check the "Actions" tab on GitHub.
name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: unitrade_test
          MYSQL_USER: unitrade
          MYSQL_PASSWORD: ci-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/unitrade_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          TEST_DB_USERNAME: unitrade
          TEST_DB_PASSWORD: ci-test-password
        run: ./mvnw -B verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
